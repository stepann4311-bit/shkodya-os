# GRUB2 configuration for Shkodya OS (x86_64 edition).
#
# The kernel draws straight into a linear framebuffer and assumes 32 bits per
# pixel, so the video mode is pinned rather than left to "auto": a mode handed
# over at 16 or 24 bpp would make the compositor write with the wrong pixel
# stride and the screen would come up torn or blank.
#
# gfxpayload additionally makes GRUB *set* that mode before handing over, which
# is what makes the Multiboot framebuffer fields meaningful at all. The kernel
# reads the address, pitch and dimensions it finds there; the 0xE0000000 in
# kernel.c is only a fallback for a bootloader that sets no video flag.

set timeout=5
set default=0

# Cosmetic: GRUB's own menu. It falls back to text mode if the video module is
# not present in the core image, which is harmless - gfxpayload below is applied
# by the Multiboot loader either way.
set gfxmode=1024x768x32
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-cyan

# The mode the guest actually boots into. Keep this explicit.
set gfxpayload=1024x768x32

menuentry "Shkodya OS x86_64" {
    multiboot /boot/myos64.bin
    boot
}
